<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 110" width="560" height="110">
  <defs>
    <linearGradient id="rsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>
  
  <!-- Icon Symbol: Stylized Route Node with Radar Pulse -->
