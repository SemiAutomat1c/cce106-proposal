    <circle cx="27" cy="27" r="6" fill="#ffffff" />
    <path d="M 16 27 A 11 11 0 0 1 38 27" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.9" />
    <path d="M 10 27 A 17 17 0 0 1 44 27" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.6" />
  </g>
  
  <!-- Wordmark -->
  <text x="72" y="50" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="42" font-weight="900" fill="#0F172A" letter-spacing="-0.5">Route<tspan fill="url(#rsGrad)">Sense</tspan></text>
  
  <!-- Tagline -->
  <text x="74" y="74" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2563EB" letter-spacing="0.1">Know where rides are. Know when they’re available.</text>
