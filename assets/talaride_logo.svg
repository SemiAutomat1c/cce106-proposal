<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="460" height="130">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;display=swap');
      .brand-title {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 82px;
        font-weight: 700;
        fill: #0F1B26;
        letter-spacing: -1.5px;
      }
      .brand-tagline {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 23px;
        font-weight: 600;
        fill: #1BA24A;
        letter-spacing: -0.2px;
      }
    </style>
  </defs>

  <!-- TalaR -->
  <text x="0" y="78" class="brand-title">TalaR</text>

  <!-- Letter 'i' stem without the dot -->
  <!-- In Poppins 82px, TalaR ends around x=262. Stem of i is at x=270, width=13.5, y=34 to 78 -->
  <rect x="269" y="34" width="13.5" height="44" rx="2" fill="#0F1B26" />

  <!-- Map Pin as the dot of 'i' -->
  <g transform="translate(262.5, 4)">
    <!-- Green Pin Body -->
    <path d="M13 0 C5.8 0 0 5.8 0 13 C0 21 13 32 13 32 C13 32 26 21 26 13 C26 5.8 20.2 0 13 0 Z" fill="#1BA24A" />
    <!-- White Inner Circle -->
    <circle cx="13" cy="12" r="5" fill="#ffffff" />
  </g>

  <!-- de -->
  <text x="294" y="78" class="brand-title">de</text>

  <!-- Tagline: Remember every ride. -->
  <text x="60" y="116" class="brand-tagline">Remember every ride.</text>
</svg>